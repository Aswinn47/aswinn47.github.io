
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Under Maintenance</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      padding: 30px;
      max-width: 550px;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      color: #58a6ff;
    }

    p {
      color: #a9b4c0;
      line-height: 1.8;
    }

    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 16px;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #3fb950;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon">⚙️</div>
    <h1>Portfolio Under Maintenance</h1>
    <p>
      I'm upgrading my portfolio with projects,
      skills, and DevOps implementations.
    </p>
    <p>Something better is deploying soon. Stay tuned!</p>
    <div class="status">● Upgrade in progress...</div>
  </main>
</body>
</html>
